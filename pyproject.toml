[project]
name = "claude-slack-bridge"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.5",
    "fastmcp>=3.2.0",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.0.0",
    # 1.30부터 async는 본체에 포함 — [async] extra는 존재하지 않는다
    "slack-bolt>=1.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
